apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://helm.traefik.io/traefik'
    chart: traefik
    targetRevision: 26.1.0
    helm:
      values: |
        providers:
          kubernetesGateway:
            enabled: true
            experimentalChannel: true
        ports:
          web:
            port: 8000
            expose: true
            exposedPort: 80
          websecure:
            port: 8443
            expose: true
            exposedPort: 443
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true