apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: argocd
spec:
  project: default
  source:
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.15.1
    helm:
      values: |
        controller:
          kind: DaemonSet
          hostNetwork: true
          service:
            type: ClusterIP
          nodeSelector:
            kubernetes.io/hostname: queen
          config:
            use-forwarded-headers: "true"
            proxy-body-size: 16g
            proxy-read-timeout: "3600"
            proxy-send-timeout: "3600"
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
