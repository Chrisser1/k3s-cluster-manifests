minecraft:
  image:
    tag: java21

  minecraftServer:
    eula: "TRUE"
    type: AUTO_CURSEFORGE
    version: "1.20.1"
    serviceType: LoadBalancer
    memory: 8192M
    motd: "Biohazard: Project Genesis"
    overrideServerProperties: true

    autoCurseForge:
      apiKey:
        existingSecret: minecraft-secrets
        secretKey: CF_API_KEY
      pageUrl: "https://www.curseforge.com/minecraft/modpacks/biohazard-project-genesis/files/7488393"

  resources:
    requests:
      memory: 8Gi
    limits:
      memory: 10Gi

  persistence:
    dataDir:
      enabled: true
      Size: 20Gi
