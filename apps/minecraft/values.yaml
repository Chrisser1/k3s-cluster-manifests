minecraft:
  image:
    tag: java21

  minecraftServer:
    eula: "TRUE"
    type: FORGE
    version: "1.20.1"
    serviceType: LoadBalancer
    memory: 8192M
    motd: "Biohazard: Project Genesis"
    overrideServerProperties: true
    rcon:
      enabled: true
      existingSecret: minecraft-rcon
      secretKey: rcon-password

  resources:
    requests:
      memory: 8Gi
    limits:
      memory: 10Gi

  persistence:
    dataDir:
      enabled: true
      Size: 20Gi

  initContainers:
    - name: download-modpack
      image: python:3-slim
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      command: ["python3", "-c"]
      args:
        - |
          import os, sys, json, zipfile
          from urllib.request import Request, urlopen

          CF_API_KEY = os.environ['CF_API_KEY']
          DATA_DIR = '/data'

          mods_dir = os.path.join(DATA_DIR, 'mods')
          if os.path.isdir(mods_dir) and os.listdir(mods_dir):
              print('Modpack already installed, skipping')
              sys.exit(0)

          print('Fetching download URL...')
          req = Request(
              'https://api.curseforge.com/v1/mods/1082278/files/7488393/download-url',
              headers={'x-api-key': CF_API_KEY}
          )
          with urlopen(req) as r:
              url = json.loads(r.read().decode())['data']
          print(f'Downloading from: {url}')

          zip_path = '/tmp/serverpack.zip'
          with urlopen(url) as r, open(zip_path, 'wb') as f:
              downloaded = 0
              while chunk := r.read(131072):
                  f.write(chunk)
                  downloaded += len(chunk)
                  if downloaded % (100 * 1024 * 1024) < 131072:
                      print(f'{downloaded // (1024*1024)}MB downloaded...')

          print('Extracting to /data...')
          with zipfile.ZipFile(zip_path) as zf:
              zf.extractall(DATA_DIR)
          os.remove(zip_path)
          print('Done!')
      env:
        - name: CF_API_KEY
          valueFrom:
            secretKeyRef:
              name: minecraft-secrets
              key: CF_API_KEY
      volumeMounts:
        - name: datadir
          mountPath: /data
