minecraft:
  image:
    tag: java21

  minecraftServer:
    eula: "TRUE"
    type: FORGE
    version: "1.20.1"
    serviceType: LoadBalancer
    memory: 8192M
    motd: "Biohazard: Project Genesis"
    overrideServerProperties: true

  resources:
    requests:
      memory: 8Gi
    limits:
      memory: 10Gi

  persistence:
    dataDir:
      enabled: true
      Size: 20Gi

  initContainers:
    - name: download-modpack
      image: alpine:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          if [ -d /data/mods ] && [ "$(ls -A /data/mods 2>/dev/null)" ]; then
            echo "Modpack already installed, skipping download"
            exit 0
          fi
          apk add --no-cache curl jq unzip
          echo "Fetching download URL from CurseForge API..."
          API_RESPONSE=$(curl -s \
            -H "x-api-key: ${CF_API_KEY}" \
            "https://api.curseforge.com/v1/mods/1082278/files/7488393/download-url")
          echo "API response: ${API_RESPONSE}"
          DOWNLOAD_URL=$(echo "${API_RESPONSE}" | jq -r '.data')
          if [ -z "${DOWNLOAD_URL}" ] || [ "${DOWNLOAD_URL}" = "null" ]; then
            echo "ERROR: Failed to get download URL. See API response above."
            exit 1
          fi
          echo "Downloading server pack (~926MB) from: ${DOWNLOAD_URL}"
          curl -L -o /tmp/serverpack.zip "${DOWNLOAD_URL}"
          echo "Extracting server pack to /data..."
          cd /data && unzip -o /tmp/serverpack.zip
          rm /tmp/serverpack.zip
          echo "Modpack installation complete"
      env:
        - name: CF_API_KEY
          valueFrom:
            secretKeyRef:
              name: minecraft-secrets
              key: CF_API_KEY
      volumeMounts:
        - name: datadir
          mountPath: /data
