minecraft:
  image:
    tag: java21

  minecraftServer:
    eula: "TRUE"
    type: FORGE
    version: "1.20.1"
    serviceType: LoadBalancer
    memory: 14336M
    motd: "star-technology"
    overrideServerProperties: true
    rcon:
      enabled: true
      password: "changeme123"

  resources:
    requests:
      memory: 14Gi
    limits:
      memory: 16Gi

  persistence:
    dataDir:
      enabled: true
      Size: 20Gi

  initContainers:
    - name: download-modpack
      image: python:3-slim
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      command: ["python3", "-c"]
      args:
        - |
          import os, sys, zipfile, subprocess
          from urllib.request import urlopen

          MODPACK_URL = os.environ['MODPACK_URL']
          DATA_DIR = '/data'

          mods_dir = os.path.join(DATA_DIR, 'mods')
          if os.path.isdir(mods_dir) and os.listdir(mods_dir):
              print('Modpack already installed, skipping')
              sys.exit(0)

          zip_path = '/tmp/serverpack.zip'
          print(f'Downloading from: {MODPACK_URL}')
          with urlopen(MODPACK_URL) as r, open(zip_path, 'wb') as f:
              downloaded = 0
              while chunk := r.read(131072):
                  f.write(chunk)
                  downloaded += len(chunk)
                  if downloaded % (100 * 1024 * 1024) < 131072:
                      print(f'{downloaded // (1024*1024)}MB downloaded...')

          print('Extracting to /data...')
          with zipfile.ZipFile(zip_path) as zf:
              zf.extractall(DATA_DIR)
          os.remove(zip_path)

          run_sh = os.path.join(DATA_DIR, 'run.sh')
          if os.path.exists(run_sh):
              print('Running run.sh...')
              os.chmod(run_sh, 0o755)
              subprocess.run(['sh', run_sh], cwd=DATA_DIR, check=True)

          print('Done!')
      env:
        - name: MODPACK_URL
          value: "https://mediafilez.forgecdn.net/files/8174/581/StarT%20Theta%201%20HF%203%20Server%20Files.zip"
      volumeMounts:
        - name: datadir
          mountPath: /data
