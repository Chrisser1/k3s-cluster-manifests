---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      initContainers:
        - name: download-modpack
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -d /data/mods ] && [ "$(ls -A /data/mods 2>/dev/null)" ]; then
                echo "Modpack already installed, skipping download"
                exit 0
              fi
              apk add --no-cache curl jq unzip
              echo "Fetching download URL from CurseForge API..."
              DOWNLOAD_URL=$(curl -sf \
                -H "x-api-key: ${CF_API_KEY}" \
                "https://api.curseforge.com/v1/mods/1082278/files/7488393/download-url" | \
                jq -r '.data')
              echo "Downloading server pack (~926MB) from: ${DOWNLOAD_URL}"
              curl -L -o /tmp/serverpack.zip "${DOWNLOAD_URL}"
              echo "Extracting server pack to /data..."
              cd /data && unzip -o /tmp/serverpack.zip
              rm /tmp/serverpack.zip
              echo "Modpack installation complete"
          env:
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: CF_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: minecraft
          image: "{{ .Values.minecraft.image.repository }}:{{ .Values.minecraft.image.tag }}"
          resources:
            requests:
              memory: "{{ .Values.minecraft.memory }}"
            limits:
              memory: "10Gi"
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "FORGE"
            - name: VERSION
              value: "1.20.1"
            - name: MEMORY
              value: "{{ .Values.minecraft.memory }}"
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: OVERRIDE_SERVER_PROPERTIES
              value: "true"
            - name: MOTD
              value: "Biohazard: Project Genesis"
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.minecraft.storage }}

---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.minecraft.service.type }}
  selector:
    app: minecraft
  ports:
    - name: minecraft
      protocol: TCP
      port: 25565
      targetPort: 25565
