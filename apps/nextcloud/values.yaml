nextcloud:
  replicaCount: 1

  nodeSelector:
    kubernetes.io/hostname: queen

  nextcloud:
    host: hivemindcloud.dk
    podSecurityContext:
      fsGroup: 33
      fsGroupChangePolicy: OnRootMismatch

    trustedDomains:
      - hivemindcloud.dk
      - localhost
      - 10.42.*.*
      - 100.94.156.45
      - 100.96.184.94

    existingSecret:
      enabled: true
      secretName: nextcloud-credentials
      usernameKey: username
      passwordKey: password

    trustedProxies:
      - 10.0.0.0/8
      - 100.0.0.0/8

    phpConfigs:
      uploadLimit.ini: |
        upload_max_filesize = 16G
        post_max_size = 16G
        max_input_time = 3600
        max_execution_time = 3600

    configs:
      custom.config.php: |-
        <?php
        $CONFIG = array(
          'default_phone_region' => 'DK',
          'maintenance_window_start' => 2,
        );
      redis.config.php: |-
        <?php
        $CONFIG = array(
          'memcache.local' => '\OC\Memcache\APCu',
          'memcache.locking' => '\OC\Memcache\Redis',
          'memcache.distributed' => '\OC\Memcache\Redis',
          'redis' => array(
            'host' => 'nextcloud-redis-master',
            'port' => 6379,
          ),
        );

    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 16Gi

  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: mysql
    host: nextcloud-mariadb
    database: nextcloud
    user: nextcloud
    existingSecret:
      enabled: true
      secretName: nextcloud-db-credentials
      usernameKey: mariadb-username
      passwordKey: mariadb-password

  mariadb:
    enabled: true
    auth:
      database: nextcloud
      username: nextcloud
      existingSecret: nextcloud-db-credentials
    primary:
      persistence:
        enabled: true
        storageClass: longhorn-queen-bulk
        size: 5Gi

  redis:
    enabled: true
    auth:
      enabled: false

  persistence:
    enabled: true
    storageClass: longhorn-queen-bulk
    size: 3Ti

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: 16g
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/server-snippet: |-
        server_tokens off;
        rewrite ^/.well-known/webfinger /index.php/.well-known/webfinger last;
        rewrite ^/.well-known/nodeinfo /index.php/.well-known/nodeinfo last;
        rewrite ^/.well-known/host-meta /public.php?service=host-meta last;
        rewrite ^/.well-known/host-meta.json /public.php?service=host-meta-json;
        location = /.well-known/carddav {
          return 301 $scheme://$host/remote.php/dav;
        }
        location = /.well-known/caldav {
          return 301 $scheme://$host/remote.php/dav;
        }
    hosts:
      - host: hivemindcloud.dk
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-tls
        hosts:
          - hivemindcloud.dk
