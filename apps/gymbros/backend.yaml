---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymbros-backend
  namespace: gymbros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gymbros-backend
  template:
    metadata:
      labels:
        app: gymbros-backend
    spec:
      containers:
        - name: backend
          image: chrisgthomsen/gymbros-backend:latest
          env:
            - name: DB_HOST
              value: gymbros-db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: gymbros
            - name: APP_ENV
              value: prod
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gymbros-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gymbros-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gymbros-secrets
                  key: JWT_SECRET
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gymbros-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gymbros-secrets
                  key: ADMIN_PASSWORD
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: gymbros-backend
  namespace: gymbros
spec:
  selector:
    app: gymbros-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080