apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gymbros-gateway
  namespace: gymbros
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "158.180.42.198.nip.io"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: gymbros-frontend-tls