---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymbros-frontend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: gymbros-frontend
  template:
    metadata:
      labels:
        app: gymbros-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: gymbros-frontend
  namespace: gymbros
spec:
  type: ClusterIP
  selector:
    app: gymbros-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gymbros-frontend
  namespace: gymbros
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: gymbros.hivemindcloud.dk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gymbros-frontend
                port:
                  number: 80
  tls:
    - secretName: gymbros-tls
      hosts:
        - gymbros.hivemindcloud.dk