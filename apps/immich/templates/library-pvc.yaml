apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.libraryPersistence.name }}
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.libraryPersistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.libraryPersistence.size }}
