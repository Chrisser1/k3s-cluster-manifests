# Immich lives in the `nextcloud` namespace on purpose: PVCs are namespace-scoped
# in Kubernetes, and family-photos-shared (apps/family-photos) is an RWX volume
# that both Nextcloud and Immich need to mount directly. Longhorn RWX volumes
# become unstable when referenced by separate PV/PVC pairs across namespaces, so
# sharing a namespace is the safe way to guarantee both apps see identical files.
namespace: nextcloud

# Immich requires a Postgres build with the vectorchord extension - a generic
# Postgres image will fail migrations. This is not bundled by the immich-charts
# chart, so it's hand-rolled here to exactly match Immich's own reference
# docker-compose.yml for v2.6.3.
postgres:
  image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
  database: immich
  # Must already exist: kubectl -n nextcloud create secret generic immich-db-credentials
  #   --from-literal=username=immich --from-literal=password=<random>
  existingSecret: immich-db-credentials
  persistence:
    name: immich-postgres-data
    storageClass: longhorn-queen-bulk
    size: 20Gi
  nodeSelector:
    kubernetes.io/hostname: queen
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    # Building the vectorchord index over a large library spikes well above
    # steady-state usage, so leave room rather than risk an OOM mid-import.
    limits:
      memory: 4Gi

# Immich's own derivative storage (thumbnails, encoded video previews, anything
# uploaded directly through Immich) - separate from family-photos-shared, which
# holds the actual originals that Nextcloud also serves.
libraryPersistence:
  name: immich-library
  storageClass: longhorn-queen-bulk
  size: 200Gi

immich:
  controllers:
    main:
      containers:
        main:
          # The immich-charts chart lags upstream releases (0.12.0 still pins
          # v2.6.3), so the tag is overridden here. Shared by the server and
          # machine-learning components, which must always run the same version.
          # Safe for v3: this install was created fresh on vectorchord (vchord),
          # not the pgvecto.rs extension that v3.0.0 dropped support for.
          image:
            tag: v3.1.0
          env:
            REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
            IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
            DB_HOSTNAME: immich-postgres
            DB_PORT: "5432"
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: password

  immich:
    persistence:
      library:
        existingClaim: immich-library

  valkey:
    enabled: true

  server:
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              # Bulk ingestion (thumbnails + face detection over a whole library)
              # is far more memory-hungry than steady-state browsing: 4Gi was
              # OOM-killed part way through the first 915-photo import. queen has
              # ~125Gi, so this is generous on purpose - it only gets used during
              # large imports and costs nothing at idle.
              limits:
                memory: 12Gi
    # Read-only import source for Immich's "External Libraries" feature
    # (configured later, per person, via the admin UI) - the same files
    # Nextcloud has mounted read-write at the same path.
    persistence:
      family-photos:
        existingClaim: family-photos-shared
        globalMounts:
          - path: /mnt/family-photos
            readOnly: true
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: queen
    ingress:
      main:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
        hosts:
          - host: photos.hivemindcloud.dk
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: immich-tls
            hosts:
              - photos.hivemindcloud.dk

  machine-learning:
    controllers:
      main:
        containers:
          main:
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 6Gi
